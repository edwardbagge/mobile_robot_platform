base_serial_bridge:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    command_rate_hz: 20.0
    command_timeout_s: 0.15
    wheel_base_m: 0.245
    max_wheel_speed_mps: 0.10
    max_pwm: 100
    min_pwm: 85
    startup_delay_s: 2.5

wheel_odometry:
  ros__parameters:
    publish_rate_hz: 2.0
    ticks_per_revolution: 2800.0
    wheel_radius_m: 0.041
    wheel_base_m: 0.38
    odom_frame_id: odom
    base_frame_id: base_link
