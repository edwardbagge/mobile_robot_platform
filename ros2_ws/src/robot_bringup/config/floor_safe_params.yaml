base_serial_bridge:
  ros__parameters:
    serial_port: /dev/robot_base
    command_source: wheel_pwm_cmd
    command_rate_hz: 20.0
    command_timeout_s: 0.15
    wheel_base_m: 0.245
    max_wheel_speed_mps: 0.10
    max_pwm: 100
    min_pwm: 85
    left_pwm_scale: 1.0
    right_pwm_scale: 1.0
    active_brake_on_stop: true
    startup_delay_s: 2.5

wheel_velocity_controller:
  ros__parameters:
    controller_rate_hz: 20.0
    command_timeout_s: 0.15
    encoder_timeout_s: 0.25
    wheel_base_m: 0.245
    wheel_radius_m: 0.041
    ticks_per_revolution: 2800.0
    max_wheel_speed_mps: 0.10
    max_tick_jump_scale: 3.0
    max_pwm: 100
    min_pwm: 85
    kp_pwm_per_mps: 240.0
    linear_deadband_mps: 0.005
    angular_deadband_rps: 0.01

wheel_odometry:
  ros__parameters:
    publish_rate_hz: 20.0
    ticks_per_revolution: 2800.0
    wheel_radius_m: 0.041
    wheel_base_m: 0.245
    max_wheel_speed_mps: 0.10
    max_tick_jump_scale: 3.0
    odom_frame_id: odom
    base_frame_id: base_link

rplidar_node:
  ros__parameters:
    serial_port: /dev/rplidar
    serial_baudrate: 115200
    frame_id: laser
    inverted: false
    angle_compensate: true
    scan_mode: ""

laser_static_transform:
  ros__parameters:
    x: 0.050
    y: 0.000
    z: 0.135
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    parent_frame_id: base_link
    child_frame_id: laser
