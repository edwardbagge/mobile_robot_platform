# Parameters for the SLAM Toolbox mapping node.
# These values tell the mapper which topics and coordinate frames to use when
# building the occupancy map from lidar scans and odometry.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    map_update_interval: 1.0
    mode: mapping
